name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result rather than a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Security and workflow considerations
      description: Note any effect on snapshots, trust, process execution, evidence, human review, or apply behavior.
